[project]
name = "mail-merge"
version = "0.1.0"
description = "Office 365 mail merge CLI using Microsoft Graph API"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.28.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "rich>=13.0",
    "tomli>=1.0.0; python_version < '3.11'",
]

[project.scripts]
mail-merge = "mail_merge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_merge"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "responses>=0.25.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
packages = ["mail_merge"]

[[tool.mypy.overrides]]
module = ["msal", "openpyxl", "tomli"]
ignore_missing_imports = true
