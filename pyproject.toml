[project]
name = "mergemail365"
version = "0.6.0"
description = "Office 365 mail merge CLI using Microsoft Graph API"
requires-python = ">=3.14"
dependencies = [
    "msal>=1.28.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "email-validator>=2.0.0",
    "rich>=13.3",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
desktop = ["flask>=3.0", "pywebview>=5.0"]

[project.scripts]
mergemail365 = "mail_merge.cli:main"
mergemail365-web = "mail_merge.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_merge"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "responses>=0.25.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "types-requests>=2.31.0",
    "playwright>=1.40",
    "pytest-playwright>=0.4",
    "pyinstaller>=6.19.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.14"
packages = ["mail_merge"]

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["msal", "openpyxl", "flask", "flask.*", "webview"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Only the rule sets this project relies on as guards, not general style:
# LOG and G keep logging lazy and through module loggers; S (flake8-bandit)
# flags risky calls. See docs/review-fixes-plan.md (G2).
select = ["LOG", "G", "S"]
# assert is used to narrow Optional types for mypy, not to validate input.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests use fake credentials and local servers; scripts run fixed tools.
"tests/**" = ["S104", "S105", "S106", "S110", "S310", "S603", "S607"]
"scripts/**" = ["S603", "S607"]
"examples/**" = ["S105", "S106"]

[tool.uv]
exclude-newer = "7 days"
