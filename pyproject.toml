[project]
name = "mergemail365"
version = "0.2.1"
description = "Office 365 mail merge CLI using Microsoft Graph API"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.28.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "email-validator>=2.0.0",
    "rich>=13.3",
    "tomli>=1.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
desktop = ["flask>=3.0", "pywebview>=5.0"]

[project.scripts]
mergemail365 = "mail_merge.cli:main"
mergemail365-web = "mail_merge.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_merge"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "responses>=0.25.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "types-requests>=2.31.0",
    "playwright>=1.40",
    "pytest-playwright>=0.4",
    "pyinstaller>=6.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
packages = ["mail_merge"]

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["msal", "openpyxl", "tomli", "flask", "flask.*", "webview"]
ignore_missing_imports = true
