name: Build release bundles

# Supply-chain policy: actions are pinned to commit SHAs and tool versions
# (uv, Biome) are pinned explicitly. Only use releases that have been public
# for at least 7 days, matching exclude-newer in pyproject.toml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: MergeMail365-macOS.zip
          - os: windows-latest
            artifact: MergeMail365-Windows.zip

    runs-on: ${{ matrix.os }}
    environment: UCL

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"

      - name: Install dependencies
        run: uv sync --locked --extra desktop

      - name: Inject version from release tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Patch version in pyproject.toml so PyInstaller picks it up
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          # Patch version in the .spec info_plist
          sed -i.bak "s/\"CFBundleVersion\": \".*\"/\"CFBundleVersion\": \"$VERSION\"/" mergemail365.spec
          sed -i.bak "s/\"CFBundleShortVersionString\": \".*\"/\"CFBundleShortVersionString\": \"$VERSION\"/" mergemail365.spec

      - name: Build with PyInstaller
        env:
          MERGEMAIL365_CLIENT_ID: ${{ vars.MERGEMAIL365_CLIENT_ID }}
          MERGEMAIL365_TENANT_ID: ${{ vars.MERGEMAIL365_TENANT_ID }}
        run: uv run --frozen pyinstaller mergemail365.spec

      - name: Sign bundle (Windows)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP\certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            .\scripts\sign-windows.ps1 -BundlePath dist\mergemail365 `
              -ImportPfx $certPath -PfxPassword $env:WINDOWS_CERTIFICATE_PWD
          } finally {
            Remove-Item $certPath -ErrorAction SilentlyContinue
          }

      - name: Archive bundle (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent MergeMail365.app MergeMail365-macOS.zip

      - name: Archive bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\mergemail365 -DestinationPath dist\MergeMail365-Windows.zip

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.TAG }}" "dist/${{ matrix.artifact }}" --clobber
